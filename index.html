<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mozaika 360° | Biograpi Living</title>
<link rel="stylesheet" href="pannellum.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#4B889A;overflow:hidden;}
  #pano{width:100%;height:100vh;background:#4B889A;}
  .bare-logo{position:absolute;top:16px;left:16px;z-index:6;height:52px;width:auto;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.45));pointer-events:none;user-select:none;}
  @media (max-width:600px){ .bare-logo{height:42px;top:12px;left:12px;} }
  /* BGP logo link v1 */
  .bgp-logo-link .bare-logo{pointer-events:auto;cursor:pointer;-webkit-touch-callout:none;}
  .bgp-logo-link{-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
<div id="pano"></div>
<a id="bgp-logo-link" class="bgp-logo-link" href="https://biograpi.ge/ka/mozaika" aria-label="MOZAIKA by Biograpi"><img class="bare-logo" src="logo.png" alt="MOZAIKA by Biograpi"></a>
<script>
/* BGP logo link v1: logo opens the project grid on biograpi.ge in the visitor's language.
   Language comes from ?lang=ka|en|ru (added to the 360 links on biograpi.ge by GTM),
   then from sessionStorage, else ka. Without JS the static href (ka) still works. */
(function () {
  var PATH = "mozaika";
  var a = document.getElementById("bgp-logo-link");
  if (!a) return;
  var lang = "ka", m = /[?&]lang=(ka|en|ru)(?:&|$)/.exec(location.search);
  try {
    if (m) { lang = m[1]; sessionStorage.setItem("bgp_lang", lang); }
    else if (/^(ka|en|ru)$/.test(sessionStorage.getItem("bgp_lang") || "")) lang = sessionStorage.getItem("bgp_lang");
  } catch (e) { if (m) lang = m[1]; }
  a.href = "https://biograpi.ge/" + lang + "/" + PATH;
})();
</script>
<script src="pannellum.js"></script>
<script>
  pannellum.viewer('pano', {
    type:'multires',
    multiRes:{basePath:'mozaika1',path:'/%l/%s%y_%x',fallbackPath:'/fallback/%s',
      extension:'jpg',tileResolution:512,maxLevel:4,cubeResolution:3816},
    autoLoad:true, autoRotate:-2, autoRotateInactivityDelay:3500,
    backgroundColor:[0.294,0.533,0.604], sceneFadeDuration:900,
    showControls:false, showZoomCtrl:false, showFullscreenCtrl:false,
    keyboardZoom:true, mouseZoom:true, hfov:100, minHfov:50, maxHfov:120, compass:false
  });
</script>
</body>
</html>
